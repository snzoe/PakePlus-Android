<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>打卡</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--text:#1d1d26;--sub:#8e8ea0;--line:#e8e8ef;--pri:#4f6ef7;--pri-light:#eef1ff}
html[data-theme=dark]{--bg:#14151b;--card:#1d1f27;--text:#e9eaef;--sub:#888b99;--line:#2b2e39;--pri:#6b85ff;--pri-light:#232a45}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));min-height:100dvh;user-select:none;transition:background .2s,color .2s}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav button{background:none;border:none;font-size:20px;color:var(--pri);padding:6px 4px;font-family:inherit}
.month-nav #todayBtn{font-size:13px;font-weight:600;border:1.5px solid var(--line);border-radius:8px;padding:4px 9px}
.month-nav span{font-size:15px;font-weight:600;min-width:84px;text-align:center}

.quick{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.qchip.done{border-color:var(--c)}
.qchip:active{transform:scale(.96)}
.qd{width:10px;height:10px;border-radius:50%;border:1.5px solid;flex-shrink:0}
.qk{color:var(--c);font-size:12px;font-weight:700}
.quick-empty{color:var(--sub);font-size:13px;padding:9px 2px}

.stats{display:flex;gap:8px;padding:0 16px;margin-bottom:14px}
.stats:empty{display:none}
.stat-card{flex:1;min-width:0;background:var(--card);border-radius:14px;padding:12px 10px;box-shadow:0 1px 4px rgba(0,0,0,.04);display:flex;flex-direction:column;justify-content:center}
.stat-card .label{font-size:11px;color:var(--sub);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-card .val{font-size:18px;font-weight:700}
.stat-card .val small{font-size:11px;font-weight:400;color:var(--sub)}

.cal{background:var(--card);margin:0 16px 14px;border-radius:16px;padding:12px 8px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--sub);margin-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}
.day:active{background:#eeeef3}
html[data-theme=dark] .day:active{background:#272a34}
.day.empty{pointer-events:none}
.day .n{font-size:14px;font-weight:500;line-height:1.2}
.day.today .n{background:var(--pri);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mini-bar{width:18px;height:4px;background:#eee;border-radius:2px;margin-top:3px;overflow:hidden}
html[data-theme=dark] .mini-bar{background:#2b2e39}
.mini-bar i{display:block;height:100%;border-radius:2px;font-style:normal}
.dots{display:flex;gap:2px;margin-top:3px;height:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%}
.note-mark{position:absolute;bottom:2px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--pri)}

.section-title{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.section-title small{font-size:11px;font-weight:400;color:var(--sub)}

.achieve-section{padding:0 16px;margin-bottom:14px}
.achieve-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.achieve{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04);position:relative;overflow:hidden;transition:transform .15s}
.achieve:active{transform:scale(.96)}
.achieve .ach-icon{font-size:24px;line-height:1;display:block;margin-bottom:6px;filter:grayscale(1);opacity:.35}
.achieve.unlocked .ach-icon{filter:none;opacity:1}
.achieve .ach-name{font-size:10px;color:var(--sub);line-height:1.3;display:block}
.achieve.unlocked .ach-name{color:var(--text);font-weight:600}
.achieve .ach-badge{position:absolute;top:4px;right:4px;font-size:10px;color:#ff9f43;opacity:0}
.achieve.unlocked .ach-badge{opacity:1}

.heat-section{padding:0 16px;margin-bottom:14px}
.heat-card{background:var(--card);border-radius:16px;padding:14px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.heat-grid::-webkit-scrollbar{display:none}
.heat-cell{width:11px;height:11px;border-radius:2px;background:var(--bg);flex-shrink:0}
html[data-theme=dark] .heat-cell{background:#2b2e39}
.heat-cell.lv1{background:#c7d2fe}
.heat-cell.lv2{background:#818cf8}
.heat-cell.lv3{background:#4f6ef7}
.heat-cell.lv4{background:#3730a3}
html[data-theme=dark] .heat-cell.lv1{background:#2f3a6a}
html[data-theme=dark] .heat-cell.lv2{background:#4f6ef7}
html[data-theme=dark] .heat-cell.lv3{background:#818cf8}
html[data-theme=dark] .heat-cell.lv4{background:#c7d2fe}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;color:var(--sub);margin-top:6px}
.heat-legend span{width:11px;height:11px;border-radius:2px}

.taskstats-section{padding:0 16px;margin-bottom:16px}
.taskstats-list{display:flex;flex-direction:column;gap:8px}
.ts-item{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ts-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ts-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ts-name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-streak{font-size:11px;color:#ff9f43;background:#fff3e0;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0}
html[data-theme=dark] .ts-streak{background:#3d2f1a;color:#ffb74d}
.ts-streak.zero{color:var(--sub);background:var(--bg)}
html[data-theme=dark] .ts-streak.zero{background:#2b2e39;color:var(--sub)}
.ts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ts-stat{text-align:center;padding:2px 0}
.ts-val{display:block;font-size:16px;font-weight:700;line-height:1.2}
.ts-lab{display:block;font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap}
.ts-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:8px;overflow:hidden}
html[data-theme=dark] .ts-bar{background:#2b2e39}
.ts-bar i{display:block;height:100%;border-radius:2px;transition:width .3s}

.today-section{padding:0 16px;margin-bottom:14px}
.today-list{display:flex;flex-direction:column;gap:8px}
.today-item{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.today-item .t-color{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.today-item .t-info{flex:1;min-width:0}
.today-item .t-name{font-size:14px;font-weight:500}
.today-item .t-meta{font-size:11px;color:var(--sub);margin-top:2px}
.today-item .t-time{font-size:11px;color:var(--pri);margin-top:2px;font-weight:600}
.today-item .t-status{font-size:12px;color:var(--sub);flex-shrink:0;text-align:right}
.today-item.done .t-status{color:var(--pri);font-weight:600}
.today-item .check-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff}
.today-item.done .check-circle{background:var(--pri);border-color:var(--pri)}

.trend-section{padding:0 16px;margin-bottom:16px}
.trend-card{background:var(--card);border-radius:16px;padding:14px 12px 10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.trend-bars{display:flex;align-items:flex-end;justify-content:space-between;height:80px;gap:4px}
.trend-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.trend-bar{width:100%;max-width:28px;background:var(--pri-light);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.trend-bar i{position:absolute;bottom:0;left:0;right:0;background:var(--pri);border-radius:6px 6px 0 0}
.trend-label{font-size:10px;color:var(--sub);margin-top:6px;white-space:nowrap}

.encourage{text-align:center;font-size:13px;color:var(--sub);padding:0 16px 16px;line-height:1.6}

.page{display:none}.page.active{display:block}
.task-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.task-item{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer}
.task-item:active{transform:scale(.99)}
.task-color{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.task-name{font-size:15px;font-weight:500;display:flex;align-items:center;gap:4px}
.task-meta{font-size:11px;color:var(--sub);margin-top:3px}
.task-del{background:none;border:none;color:#ff6b6b;font-size:18px;padding:4px 8px;font-family:inherit;flex-shrink:0}
.empty-tip{text-align:center;color:var(--sub);font-size:13px;padding:26px 0}

.add-card{background:var(--card);margin:0 16px 14px;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.add-card input,.add-card select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:var(--bg);margin-bottom:8px;font-family:inherit;color:var(--text)}
.add-card input:focus,.add-card select:focus{border-color:var(--pri)}
.add-row{display:flex;gap:8px}.add-row input{flex:1;margin-bottom:0}
.add-row button{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;font-family:inherit}
.colors{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.colors span{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.colors span.on{border-color:var(--text);transform:scale(1.15)}
.mode-btns{display:flex;gap:6px;margin-bottom:8px}
.mode-btns button{flex:1;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;color:var(--sub);font-family:inherit}
.mode-btns button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-light)}
.field-label{font-size:12px;color:var(--sub);margin:8px 0 6px}
.btn-add{width:100%;background:var(--pri);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600;margin-top:10px;font-family:inherit}
.link-btn{background:none;border:none;color:var(--sub);font-size:13px;font-family:inherit;padding:2px 6px}

.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
html[data-theme=dark] .tabbar{background:rgba(29,31,39,.92)}
.tabbar button{flex:1;background:none;border:none;padding:8px 0 6px;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.tabbar button.active{color:var(--pri)}
.tabbar button .ico{font-size:20px}

.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:20px 20px 0 0;padding:8px 20px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,1,.3,1);max-height:76vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:4px}
.sheet-sub{font-size:13px;color:var(--sub);margin-bottom:14px}
.check-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.check-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);cursor:pointer}
.check-item.done{background:var(--pri-light)}
.cbox{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff}
.check-item.done .cbox{border-color:var(--pri);background:var(--pri)}
.cinfo{flex:1;min-width:0}.cname{font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cmeta{font-size:11px;color:var(--sub);margin-top:1px}
.cmeta .tm{color:var(--pri);font-weight:600}
.retro-tag{display:inline-block;background:#fff3e0;color:#e67e22;font-size:10px;padding:1px 6px;border-radius:6px}
.count-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg)}
.count-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pri);font-family:inherit}
.count-btn:active{background:var(--pri-light)}
.count-val{text-align:center;font-size:18px;font-weight:700}
.count-bar{height:6px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}
html[data-theme=dark] .count-bar{background:#2b2e39}
.count-bar i{display:block;height:100%;border-radius:3px}
.count-times{font-size:10px;color:var(--sub);margin-top:5px;text-align:center;line-height:1.5;word-break:break-all}
.count-times b{color:var(--pri);font-weight:600}
.slot-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);margin-top:6px}
.slot-item.done{background:var(--pri-light)}
.sbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff}
.slot-item.done .sbox{border-color:var(--pri);background:var(--pri)}
.note-area{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;outline:none;min-height:60px;background:var(--bg);color:var(--text)}
.note-area:focus{border-color:var(--pri)}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.sheet-actions button{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--pri);color:#fff}.btn-ghost{background:var(--bg);color:var(--text)}
.sett{padding:16px;display:flex;flex-direction:column;gap:10px}
.sett button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:15px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text)}
.sett .hint{font-size:12px;color:var(--sub);line-height:1.7}
.sett .info{font-size:12px;color:var(--sub);text-align:center;padding:4px 0}
.reminder-list{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.rem-item{display:flex;align-items:center;justify-content:space-between;font-size:13px;background:var(--bg);padding:8px 12px;border-radius:8px}
.rem-item button{background:none;border:none;color:#ff6b6b;font-size:15px;font-family:inherit}

.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:99;display:flex;align-items:center;gap:10px;max-width:88vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast-btn{background:rgba(255,255,255,.22);border:none;color:inherit;font-size:13px;padding:3px 10px;border-radius:8px;font-weight:600;font-family:inherit;flex-shrink:0}
html[data-theme=dark] .toast{background:#e9eaef;color:#14151b}
html[data-theme=dark] .toast-btn{background:rgba(0,0,0,.12)}
.badge{display:inline-block;background:var(--pri-light);color:var(--pri);font-size:10px;padding:1px 6px;border-radius:8px;font-weight:400}
</style>
</head>
<body>

<header>
  <h1>打卡</h1>
  <div class="month-nav">
    <button id="todayBtn">今天</button>
    <button id="prevM">‹</button><span id="monthLabel"></span><button id="nextM">›</button>
  </div>
</header>

<div class="page active" id="pgCal">
  <div class="quick" id="quick"></div>

  <div class="cal">
    <div class="wk"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="days" id="days"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="today-section">
    <div class="section-title">今日任务</div>
    <div class="today-list" id="todayList"></div>
  </div>

  <div class="taskstats-section">
    <div class="section-title">任务统计 <small>累计 / 次数 / 连续</small></div>
    <div class="taskstats-list" id="taskStatsList"></div>
  </div>

  <div class="trend-section">
    <div class="section-title">近 7 天趋势</div>
    <div class="trend-card">
      <div class="trend-bars" id="trendBars"></div>
    </div>
  </div>

  <div class="achieve-section">
    <div class="section-title">成就徽章 <small id="achProgress">0 / 0</small></div>
    <div class="achieve-grid" id="achieveGrid"></div>
  </div>

  <div class="heat-section">
    <div class="section-title">年度热力图 <small id="heatSub"></small></div>
    <div class="heat-card">
      <div class="heat-grid" id="heatGrid"></div>
      <div class="heat-legend">
        <span style="background:var(--bg)"></span>
        <span class="lv1"></span><span class="lv2"></span><span class="lv3"></span><span class="lv4"></span>
        <span style="color:var(--sub);background:none;width:auto;margin-left:4px">多</span>
      </div>
    </div>
  </div>

  <div class="encourage" id="encourage"></div>
</div>

<div class="page" id="pgTask">
  <div class="add-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:14px;font-weight:600" id="formTitle">新建任务</span>
      <button class="link-btn" id="cancelEdit" hidden>取消编辑</button>
    </div>
    <div class="colors" id="colors"></div>
    <input id="newName" placeholder="任务名，如 喝水、背单词" maxlength="12">
    <div class="mode-btns" id="modeBtns">
      <button class="on" data-m="single">单次/天</button>
      <button data-m="count">计数</button>
      <button data-m="slots">时段</button>
    </div>
    <div id="modeExtra"></div>
    <div id="remWrap" hidden>
      <div class="field-label">提醒时间（到点会发系统通知）</div>
      <div class="reminder-list" id="remList"></div>
      <div class="add-row" style="margin-top:6px">
        <input type="time" id="remTime" style="flex:1;margin:0">
        <button id="addRem">添加</button>
      </div>
    </div>
    <button class="btn-add" id="addTask">添加任务</button>
  </div>
  <div class="task-list" id="taskList"></div>
</div>

<div class="page" id="pgSet">
  <div class="sett">
    <button id="themeBtn">🎨 外观：<span id="themeLabel">跟随系统</span></button>
    <button id="notifyBtn">🔔 开启提醒通知权限</button>
    <button id="exportBtn">📤 导出数据</button>
    <button id="importBtn">📥 导入数据</button>
    <input type="file" id="imp" accept=".json" style="display:none">
    <button style="border-color:#ffd0d0;color:#ff4757" id="clearBtn">🗑 清空数据</button>
    <div class="info" id="dataInfo"></div>

<script>
/* ========== 基础 ========== */
const COLORS=['#4f6ef7','#34c77b','#ff9f43','#ff6b8a','#20c9c0','#a55eea','#fd79a8','#636e72'];
const $=id=>document.getElementById(id);
const THEME_LABEL={auto:'跟随系统',light:'浅色',dark:'深色'};

/* 环境检测：是否运行在 Capacitor 原生 App 里 */
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

const ACHIEVEMENTS=[
  {id:'a3',   days:3,   icon:'🌱', name:'起步'},
  {id:'a7',   days:7,   icon:'🌿', name:'一周坚持'},
  {id:'a14',  days:14,  icon:'🌳', name:'两周'},
  {id:'a30',  days:30,  icon:'⭐', name:'满月'},
  {id:'a60',  days:60,  icon:'🌟', name:'两月'},
  {id:'a100', days:100, icon:'💎', name:'百日'},
  {id:'a180', days:180, icon:'👑', name:'半年'},
  {id:'a365', days:365, icon:'🏆', name:'全年'}
];

let S={tasks:[],records:{},settings:{theme:'auto'}};
let curYear,curMonth,selDate=null;
let pickColor=COLORS[0],pickMode='single',pickTarget=8,pickSlots='早,中,晚',pickReminders=[];
let editId=null,extraMode=null;
let fired=new Set(),toastTimer=null;

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd}
function today(){return fmt(new Date())}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||8)}catch(e){}}
function fmtTime(ts){
  if(!ts)return '';
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtTimes(arr){
  if(!Array.isArray(arr)||!arr.length)return '';
  return arr.map(fmtTime).join(' · ');
}
/* 把字符串转成 32 位整数，用于生成稳定的通知 ID */
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){
    h=((h<<5)-h)+s.charCodeAt(i);
    h=h|0;
  }
  return Math.abs(h);
}
function toast(msg,actionLabel,actionFn){
  const el=$('toast');
  el.innerHTML='';
  const sp=document.createElement('span');sp.textContent=msg;el.append(sp);
  if(actionLabel){
    const b=document.createElement('button');b.className='toast-btn';b.textContent=actionLabel;
    b.onclick=()=>{el.classList.remove('show');clearTimeout(toastTimer);actionFn&&actionFn()};
    el.append(b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),actionLabel?4500:1800);
}

/* ========== 存储 ========== */
function save(){try{localStorage.setItem('dk_data_v2',JSON.stringify(S))}catch(e){toast('保存失败，请导出备份')}}
function load(){
  try{
    const raw=localStorage.getItem('dk_data_v2')||localStorage.getItem('dk_data');
    if(raw){
      const d=JSON.parse(raw);
      if(d&&typeof d==='object'){
        S.tasks=Array.isArray(d.tasks)?d.tasks:[];
        S.records=(d.records&&typeof d.records==='object')?d.records:{};
        S.settings=Object.assign({theme:'auto'},d.settings||{});
      }
    }
  }catch(e){}
  migrate();
  if(!S.tasks.length){
    S.tasks=[
      {id:gid(),name:'早起',color:'#ff9f43',mode:'single',target:1,slots:[],reminders:[],reminderEnabled:false},
      {id:gid(),name:'喝水',color:'#20c9c0',mode:'count',target:8,slots:[],reminders:[{time:'09:00'},{time:'15:00'}],reminderEnabled:true}
    ];
  }
  save();
}
function migrate(){
  S.tasks=Array.isArray(S.tasks)?S.tasks:[];
  S.records=(S.records&&typeof S.records==='object')?S.records:{};
  S.settings=Object.assign({theme:'auto'},S.settings||{});
  for(const k in S.records){
    const r=S.records[k];if(!r)continue;
    if(!r.entries||typeof r.entries!=='object')r.entries={};
    for(const tid in r.entries){
      const v=r.entries[tid];
      if(v&&typeof v==='object'&&!('count' in v)){
        r.entries[tid]={count:1,retro:!!v.retro,at:v.at||Date.now(),times:v.at?[v.at]:[],slots:null};
      }
      const e=r.entries[tid];
      if(e&&typeof e==='object'){
        if(!Array.isArray(e.times)){ e.times=e.at?[e.at]:[]; }
      }
    }
  }
  S.tasks.forEach(t=>{
    if(!t.id)t.id=gid();
    if(!t.mode)t.mode='single';
    if(!t.target)t.target=1;
    if(!Array.isArray(t.slots))t.slots=[];
    if(!Array.isArray(t.reminders))t.reminders=[];
    if(!t.color)t.color=COLORS[0];
    if(typeof t.reminderEnabled!=='boolean')t.reminderEnabled=t.reminders.length>0;
  });
  for(const k in S.records){
    const r=S.records[k];
    if(r&&!Object.keys(r.entries||{}).length&&!r.note)delete S.records[k];
  }
}

/* ========== 数据辅助 ========== */
function ensure(ds){if(!S.records[ds])S.records[ds]={entries:{},note:''}}
function entry(ds,tid){
  ensure(ds);
  const r=S.records[ds];
  if(!r.entries[tid])r.entries[tid]={count:0,retro:ds<today(),at:Date.now(),times:[],slots:null};
  if(!Array.isArray(r.entries[tid].times))r.entries[tid].times=[];
  return r.entries[tid];
}
function slotList(t){return (t.slots&&t.slots.length)?t.slots:['早','中','晚']}
function isDone(t,ds){
  const e=S.records[ds]&&S.records[ds].entries[t.id];
  if(!e)return false;
  if(t.mode==='single')return e.count>0;
  if(t.mode==='count')return e.count>=t.target;
  return Object.keys(e.slots||{}).length>=slotList(t).length;
}
function hasContent(t,e){
  if(!e)return false;
  if(t.mode==='single'||t.mode==='count')return e.count>0;
  return !!(e.slots&&Object.keys(e.slots).length);
}
function taskDetailedStats(t){
  const dates=Object.keys(S.records).sort();
  let totalDays=0,totalCount=0,best=0,run=0,prev=null;
  for(const ds of dates){
    const r=S.records[ds];
    const e=r&&r.entries&&r.entries[t.id];
    if(!e)continue;
    if(hasContent(t,e))totalDays++;
    if(t.mode==='single'){ if(e.count>0)totalCount++; }
    else if(t.mode==='count'){ totalCount+=(e.count||0); }
    else{ totalCount+=Object.keys(e.slots||{}).length; }
    if(isDone(t,ds)){
      run=(prev&&dayDiff(prev,ds)===1)?run+1:1;
      prev=ds;
      if(run>best)best=run;
    }else{ run=0;prev=null; }
  }
  let cur=0,d=new Date();
  if(!isDone(t,fmt(d)))d.setDate(d.getDate()-1);
  while(isDone(t,fmt(d))){cur++;d.setDate(d.getDate()-1)}
  return {totalDays,totalCount,best,current:cur};
}
function maxStreak(){
  let m=0;
  S.tasks.forEach(t=>{
    const s=taskDetailedStats(t);
    if(s.current>m)m=s.current;
    if(s.best>m)m=s.best;
  });
  return m;
}

/* ========== 日历渲染 ========== */
function render(){
  $('monthLabel').textContent=curYear+'年'+(curMonth+1)+'月';
  renderQuick();
  const first=new Date(curYear,curMonth,1).getDay();
  const total=new Date(curYear,curMonth+1,0).getDate();
  const td=today();
  let h='';
  for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(let d=1;d<=total;d++){
    const ds=curYear+'-'+String(curMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const rec=S.records[ds],isToday=ds===td;
    let inner='<span class="n">'+d+'</span>';
    const items=S.tasks.map(t=>({t,e:rec&&rec.entries[t.id]})).filter(x=>hasContent(x.t,x.e));
    if(items.length===1&&items[0].t.mode==='count'){
      const p=Math.min(1,items[0].e.count/items[0].t.target);
      inner+='<div class="mini-bar"><i style="width:'+(p*100)+'%;background:'+items[0].t.color+'"></i></div>';
    }else if(items.length){
      inner+='<div class="dots">'+items.map(({t})=>{
        const ok=isDone(t,ds);
        return '<span class="dot" style="background:'+t.color+';opacity:'+(ok?1:.3)+'"></span>';
      }).join('')+'</div>';
    }
    if(rec&&rec.note)inner+='<span class="note-mark"></span>';
    h+='<div class="day'+(isToday?' today':'')+'" data-d="'+ds+'">'+inner+'</div>';
  }
  $('days').innerHTML=h;

  renderStats();
  renderTodayList();
  renderTaskStats();
  renderTrend();
  renderAchievements();
  renderHeatmap();
  renderEncourage();
}

function renderStats(){
  const now=new Date();
  const todayDone=S.tasks.filter(t=>isDone(t,today())).length;
  const pre=curYear+'-'+String(curMonth+1).padStart(2,'0');
  const totalDays=new Date(curYear,curMonth+1,0).getDate();
  const isCur=curYear===now.getFullYear()&&curMonth===now.getMonth();
  const isFuture=new Date(curYear,curMonth,1)>new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const elapsed=isFuture?0:(isCur?now.getDate():totalDays);
  let slots=S.tasks.length*elapsed,filled=0;
  S.tasks.forEach(t=>{
    for(let d=1;d<=elapsed;d++){
      const ds=pre+'-'+String(d).padStart(2,'0');
      if(isDone(t,ds))filled++;
    }
  });
  const pct=slots?Math.round(filled/slots*100):0;
  let allDays=0;
  S.tasks.forEach(t=>{allDays+=taskDetailedStats(t).totalDays});
  let html='';
  if(S.tasks.length){
    html+='<div class="stat-card"><div class="label">今日完成</div><div class="val">'+todayDone+'<small>/'+S.tasks.length+'</small></div></div>';
    html+='<div class="stat-card"><div class="label">本月完成率</div><div class="val">'+pct+'<small>%</small></div></div>';
    html+='<div class="stat-card"><div class="label">全部累计</div><div class="val">'+allDays+'<small>天</small></div></div>';
  }
  $('stats').innerHTML=html;
}

function renderAchievements(){
  const m=maxStreak();
  let unlocked=0;
  $('achieveGrid').innerHTML=ACHIEVEMENTS.map(a=>{
    const ok=m>=a.days;
    if(ok)unlocked++;
    return '<div class="achieve'+(ok?' unlocked':'')+'" title="'+a.days+'天连续">'+
      '<span class="ach-badge">✓</span>'+
      '<span class="ach-icon">'+a.icon+'</span>'+
      '<span class="ach-name">'+a.name+'<br>'+a.days+'天</span>'+
    '</div>';
  }).join('');
  $('achProgress').textContent=unlocked+' / '+ACHIEVEMENTS.length;
}

function renderTaskStats(){
  const wrap=$('taskStatsList');
  if(!S.tasks.length){
    wrap.innerHTML='<div class="empty-tip" style="padding:16px 0">还没有任务，去「任务」页添加</div>';
    return;
  }
  wrap.innerHTML=S.tasks.map(t=>{
    const s=taskDetailedStats(t);
    const streakCls=s.current>0?'ts-streak':'ts-streak zero';
    const streakTxt=s.current>0?('🔥 '+s.current+'天'):'未开始';
    const barPct=s.best>0?Math.min(100,Math.round(s.current/s.best*100)):0;
    return '<div class="ts-item">'+
      '<div class="ts-head">'+
        '<span class="ts-dot" style="background:'+t.color+'"></span>'+
        '<span class="ts-name">'+esc(t.name)+'</span>'+
        '<span class="'+streakCls+'">'+streakTxt+'</span>'+
      '</div>'+
      '<div class="ts-grid">'+
        '<div class="ts-stat"><span class="ts-val" style="color:'+t.color+'">'+s.totalDays+'</span><span class="ts-lab">累计天数</span></div>'+
        '<div class="ts-stat"><span class="ts-val" style="color:'+t.color+'">'+s.totalCount+'</span><span class="ts-lab">累计次数</span></div>'+
        '<div class="ts-stat"><span class="ts-val" style="color:'+t.color+'">'+s.current+'</span><span class="ts-lab">当前连续</span></div>'+
        '<div class="ts-stat"><span class="ts-val" style="color:'+t.color+'">'+s.best+'</span><span class="ts-lab">最长连续</span></div>'+
      '</div>'+
      '<div class="ts-bar"><i style="width:'+barPct+'%;background:'+t.color+'"></i></div>'+
    '</div>';
  }).join('');
}

function renderHeatmap(){
  const grid=$('heatGrid');
  const totalTasks=S.tasks.length||1;
  const end=new Date();
  const start=new Date();
  start.setDate(start.getDate()-83);
  while(start.getDay()!==0)start.setDate(start.getDate()-1);

  let cells='';
  let cur=new Date(start);
  while(cur<=end){
    for(let i=0;i<7;i++){
      const ds=fmt(cur);
      const r=S.records[ds];
      let cnt=0;
      if(r){
        S.tasks.forEach(t=>{ if(isDone(t,ds))cnt++; });
      }
      const ratio=cnt/totalTasks;
      let lv=0;
      if(cnt>0)lv=Math.min(4,Math.ceil(ratio*4));
      cells+='<div class="heat-cell'+(lv?' lv'+lv:'')+'" title="'+ds+' 完成 '+cnt+' 个"></div>';
      cur.setDate(cur.getDate()+1);
      if(cur>end)break;
    }
  }
  grid.innerHTML=cells;
  const cnt=Object.keys(S.records).length;
  $('heatSub').textContent='共 '+cnt+' 天有记录';
}

function renderTodayList(){
  const ds=today();
  const wrap=$('todayList');
  if(!S.tasks.length){
    wrap.innerHTML='<div class="empty-tip" style="padding:16px 0">还没有任务，去「任务」页添加</div>';
    return;
  }
  wrap.innerHTML=S.tasks.map(t=>{
    const e=S.records[ds]&&S.records[ds].entries[t.id];
    let done=false,status='',meta='',timeStr='';
    if(t.mode==='single'){
      done=!!(e&&e.count>0);
      status=done?'已完成':'未打卡';
      if(done)timeStr='🕐 '+fmtTime(e.at);
    }else if(t.mode==='count'){
      const c=e?e.count:0;
      done=c>=t.target;
      status=c+' / '+t.target;
      meta='目标 '+t.target+' 次';
      if(c>0)timeStr='🕐 最后 '+fmtTime(e.at);
    }else{
      const need=slotList(t),c=e&&e.slots?Object.keys(e.slots).length:0;
      done=c>=need.length;
      status=c+' / '+need.length;
      meta=need.join('、');
      if(c>0)timeStr='🕐 最后 '+fmtTime(e.at);
    }
    return '<div class="today-item'+(done?' done':'')+'">'+
      '<span class="t-color" style="background:'+t.color+'"></span>'+
      '<div class="t-info">'+
        '<div class="t-name">'+esc(t.name)+'</div>'+
        (meta?'<div class="t-meta">'+meta+'</div>':'')+
        (timeStr?'<div class="t-time">'+timeStr+'</div>':'')+
      '</div>'+
      '<span class="t-status">'+status+'</span>'+
      '<div class="check-circle">'+(done?'✓':'')+'</div>'+
    '</div>';
  }).join('');
}

function renderTrend(){
  const bars=$('trendBars');
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    days.push(fmt(d));
  }
  const counts=days.map(ds=>S.tasks.filter(t=>isDone(t,ds)).length);
  const max=Math.max(...counts,1);
  bars.innerHTML=days.map((ds,i)=>{
    const c=counts[i];
    const h=Math.round(c/max*100);
    const dayLabel=(i===6)?'今天':ds.slice(5).replace('-','/');
    return '<div class="trend-bar-item">'+
      '<div class="trend-bar" style="height:'+h+'%"><i style="height:'+(c>0?100:0)+'%;background:'+(c>0?'var(--pri)':'transparent')+'"></i></div>'+
      '<div class="trend-label">'+dayLabel+'</div>'+
    '</div>';
  }).join('');
}

const ENCOURAGES=[
  '坚持就是胜利，你已经在路上了 ✨',
  '每天进步一点点，积少成多 🌱',
  '打卡不是目的，成长才是 💪',
  '你已经很棒了，继续保持 🔥',
  '小小的坚持，大大的改变 🌟',
  '今天的努力，是明天的礼物 🎁',
  '自律给你自由 🕊️',
  '不要小看每一天的积累 📈'
];
function renderEncourage(){
  const idx=Math.floor(Math.random()*ENCOURAGES.length);
  $('encourage').textContent=ENCOURAGES[idx];
}

function renderQuick(){
  const ds=today();
  const html=S.tasks.map(t=>{
    const e=S.records[ds]&&S.records[ds].entries[t.id];
    let label=t.name,sub='',done=false;
    if(t.mode==='single'){ done=!!(e&&e.count>0); }
    else if(t.mode==='count'){ const c=e?e.count:0;sub=' '+c+'/'+t.target;done=c>=t.target; }
    else{ const need=slotList(t),c=e&&e.slots?Object.keys(e.slots).length:0;sub=' '+c+'/'+need.length;done=c>=need.length; }
    return '<button class="qchip'+(done?' done':'')+'" data-t="'+t.id+'" style="--c:'+t.color+'">'+
      '<span class="qd" style="background:'+(done?t.color:'transparent')+';border-color:'+t.color+'"></span>'+
      '<span>'+esc(label)+sub+'</span>'+(done?'<span class="qk">✓</span>':'')+'</button>';
  }).join('');
  $('quick').innerHTML=html||'<span class="quick-empty">还没有任务，去「任务」页添加 →</span>';
}

/* ========== 日期面板 ========== */
function openSheet(ds){
  selDate=ds;
  const d=new Date(ds+'T12:00:00'),wd=['日','一','二','三','四','五','六'][d.getDay()];
  $('sheetTitle').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日';
  $('sheetSub').textContent='周'+wd+(ds===today()?' · 今天':ds<today()?' · 补签':' · 未来');
  $('noteArea').value=(S.records[ds]&&S.records[ds].note)||'';
  buildChecks();
  $('mask').classList.add('show');
  $('sheet').classList.add('show');
  buzz(6);
}
function closeSheet(){
  $('mask').classList.remove('show');
  $('sheet').classList.remove('show');
  selDate=null;
}
function buildChecks(){
  const ds=selDate,rec=S.records[ds];
  $('checkList').innerHTML=S.tasks.map(t=>{
    const e=rec&&rec.entries[t.id];
    if(t.mode==='single'){
      const done=!!(e&&e.count>0);
      const tstr=e&&e.at?fmtTime(e.at):'';
      return '<div class="check-item'+(done?' done':'')+'" data-t="'+t.id+'" data-m="single">'+
        '<div class="cbox" style="'+(done?'background:'+t.color+';border-color:'+t.color:'')+'">'+(done?'✓':'')+'</div>'+
        '<div class="cinfo"><div class="cname"><span style="color:'+t.color+'">●</span> '+esc(t.name)+
        (e&&e.retro&&done?'<span class="retro-tag">补签</span>':'')+'</div>'+
        '<div class="cmeta">'+(done?('已完成 · <span class="tm">🕐 '+(tstr||'--:--')+'</span>'):'未打卡')+'</div></div></div>';
    }
    if(t.mode==='count'){
      const c=e?e.count:0,p=Math.min(1,c/t.target);
      const times=e&&e.times?e.times:[];
      const timesStr=times.length?fmtTimes(times):'';
      return '<div class="count-row" data-t="'+t.id+'" data-m="count">'+
        '<div class="count-btn" data-d="-1">−</div>'+
        '<div style="flex:1"><div class="count-val"><span style="color:'+t.color+'">'+c+'</span> / '+t.target+'</div>'+
        '<div class="count-bar"><i style="width:'+(p*100)+'%;background:'+t.color+'"></i></div>'+
        (timesStr?'<div class="count-times">🕐 <b>'+timesStr+'</b></div>':'')+
        '</div>'+
        '<div class="count-btn" data-d="1">+</div></div>';
    }
    const sl=slotList(t),so=e&&e.slots?e.slots:{};
    return '<div style="padding:2px 0"><div style="font-size:13px;font-weight:600;margin:8px 0 2px;color:'+t.color+'">● '+esc(t.name)+'</div>'+
      sl.map(s=>{
        const ok=!!so[s];
        const tm=ok?fmtTime(so[s]):'';
        return '<div class="slot-item'+(ok?' done':'')+'" data-t="'+t.id+'" data-s="'+esc(s)+'">'+
          '<div class="sbox" style="'+(ok?'background:'+t.color+';border-color:'+t.color:'')+'">'+(ok?'✓':'')+'</div>'+
          '<div class="cinfo"><div class="cname">'+esc(s)+'</div>'+
          '<div class="cmeta">'+(ok?('已完成 · <span class="tm">🕐 '+tm+'</span>'):'未完成')+'</div></div></div>';
      }).join('')+'</div>';
  }).join('')||'<div style="color:var(--sub);font-size:13px;padding:8px 0">先去「任务」页添加打卡项</div>';

  $('checkList').querySelectorAll('.check-item[data-m=single]').forEach(el=>{
    el.onclick=()=>{
      const en=entry(ds,el.dataset.t);
      const now=Date.now();
      if(en.count>0){ en.count=0;en.times=[]; }
      else{ en.count=1;en.at=now;en.times=[now]; }
      buzz();save();buildChecks();render();
    };
  });
  $('checkList').querySelectorAll('.count-row').forEach(el=>{
    el.querySelectorAll('.count-btn').forEach(b=>{
      b.onclick=()=>{
        const en=entry(ds,el.dataset.t);
        const now=Date.now();
        const d=parseInt(b.dataset.d,10);
        const next=Math.max(0,Math.min(999,en.count+d));
        if(d>0&&next>en.count){
          en.times.push(now);en.at=now;
        }else if(d<0&&next<en.count){
          en.times.pop();
          if(en.times.length)en.at=en.times[en.times.length-1];
        }
        en.count=next;
        buzz();save();buildChecks();render();
      };
    });
  });
  $('checkList').querySelectorAll('.slot-item').forEach(el=>{
    el.onclick=()=>{
      const en=entry(ds,el.dataset.t);
      if(!en.slots)en.slots={};
      if(en.slots[el.dataset.s])delete en.slots[el.dataset.s];
      else{ en.slots[el.dataset.s]=Date.now();en.at=Date.now(); }
      if(!Object.keys(en.slots).length)en.slots=null;
      buzz();save();buildChecks();render();
    };
  });
}
function saveSheet(){
  if(!selDate)return;
  const rec=S.records[selDate];
  if(rec){
    const v=$('noteArea').value.trim();
    if(v)rec.note=v;else delete rec.note;
    for(const tid in rec.entries){
      const t=S.tasks.find(x=>x.id===tid);
      if(!t){delete rec.entries[tid];continue;}
      if(!hasContent(t,rec.entries[tid]))delete rec.entries[tid];
    }
    if(!Object.keys(rec.entries).length&&!rec.note)delete S.records[selDate];
  }
  save();closeSheet();render();toast('已保存');
}

/* ========== 任务表单 ========== */
function modeExtraHTML(){
  if(pickMode==='count')
    return '<input id="newTarget" type="number" min="1" max="99" value="'+pickTarget+'" placeholder="每天目标次数">';
  if(pickMode==='slots')
    return '<input id="newSlots" value="'+esc(pickSlots)+'" placeholder="时段名，用逗号分隔，如 早,中,晚">';
  return '';
}
function syncModeExtra(){
  const tg=$('newTarget'),sl=$('newSlots');
  if(tg)pickTarget=Math.max(1,Math.min(99,parseInt(tg.value,10)||1));
  if(sl)pickSlots=sl.value||'早,中,晚';
}
function renderModeExtra(force){
  if(!force&&extraMode===pickMode)return;
  extraMode=pickMode;
  $('modeExtra').innerHTML=modeExtraHTML();
}
function renderColors(){
  $('colors').innerHTML=COLORS.map(c=>'<span style="background:'+c+'" class="'+(c===pickColor?'on':'')+'" data-c="'+c+'"></span>').join('');
}
function renderRemList(){
  $('remList').innerHTML=pickReminders.length
    ?pickReminders.map((t,i)=>'<div class="rem-item"><span>🔔 '+t+'</span><button data-i="'+i+'">✕</button></div>').join('')
    :'<div style="font-size:12px;color:var(--sub)">未设置提醒</div>';
}
function renderTasks(){
  renderColors();
  $('modeBtns').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===pickMode));
  renderModeExtra(false);
  $('taskList').innerHTML=S.tasks.map((t,i)=>{
    const s=taskDetailedStats(t);
    const meta=t.mode==='single'?'单次':t.mode==='count'?(t.target+'次/天'):slotList(t).join('/');
    const rem=t.reminderEnabled&&t.reminders.length?'<span class="badge">🔔'+t.reminders.length+'</span>':'';
    return '<div class="task-item" data-i="'+i+'">'+
      '<span class="task-color" style="background:'+t.color+'"></span>'+
      '<div style="flex:1;min-width:0">'+
      '<div class="task-name">'+esc(t.name)+rem+'</div>'+
      '<div class="task-meta">'+meta+' · 累计 '+s.totalDays+' 天 · '+s.totalCount+' 次 · 连续 '+s.current+' 天</div>'+
      '</div><button class="task-del" data-i="'+i+'" title="删除">✕</button></div>';
  }).join('')||'<div class="empty-tip">还没有任务，上面添加一个吧</div>';
}
function startEdit(i){
  const t=S.tasks[i];if(!t)return;
  editId=t.id;
  pickColor=t.color;pickMode=t.mode;pickTarget=t.target||1;
  pickSlots=t.slots.join(',')||'早,中,晚';
  pickReminders=t.reminders.map(r=>r.time).sort();
  $('newName').value=t.name;
  $('formTitle').textContent='编辑任务';
  $('addTask').textContent='保存修改';
  $('cancelEdit').hidden=false;
  $('remWrap').hidden=false;
  renderColors();renderModeExtra(true);renderRemList();
  window.scrollTo({top:0,behavior:'smooth'});
}
function cancelEdit(){
  editId=null;pickReminders=[];
  $('newName').value='';
  $('formTitle').textContent='新建任务';
  $('addTask').textContent='添加任务';
  $('cancelEdit').hidden=true;
  $('remWrap').hidden=true;
  renderColors();renderModeExtra(true);renderRemList();
}
function delTask(i){
  const t=S.tasks[i];if(!t)return;
  if(!confirm('删除「'+t.name+'」？该任务的打卡记录也会一起删除。'))return;
  const removed=S.tasks.splice(i,1)[0];
  if(editId===removed.id)cancelEdit();
  save();render();renderTasks();
  /* 删除后重新预约通知 */
  if(IS_NATIVE) scheduleAllNotifications();
  toast('已删除「'+removed.name+'」','撤销',()=>{
    S.tasks.splice(i,0,removed);
    save();render();renderTasks();
    if(IS_NATIVE) scheduleAllNotifications();
    toast('已恢复');
  });
}

/* ========== 事件绑定 ========== */
$('colors').onclick=e=>{const s=e.target.closest('[data-c]');if(s){pickColor=s.dataset.c;renderColors()}};
$('modeBtns').onclick=e=>{
  const b=e.target.closest('button[data-m]');if(!b)return;
  syncModeExtra();
  pickMode=b.dataset.m;
  renderModeExtra(true);
  $('modeBtns').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
};
$('remList').onclick=e=>{
  const b=e.target.closest('button[data-i]');if(!b)return;
  pickReminders.splice(parseInt(b.dataset.i,10),1);renderRemList();
};
$('addRem').onclick=()=>{
  const v=$('remTime').value;if(!v)return toast('先选个时间');
  if(pickReminders.includes(v))return toast('这个时间已经有啦');
  if(pickReminders.length>=8)return toast('最多 8 个提醒');
  pickReminders.push(v);pickReminders.sort();renderRemList();
};
$('cancelEdit').onclick=cancelEdit;

$('addTask').onclick=()=>{
  const n=$('newName').value.trim();
  if(!n){toast('给任务起个名字吧');$('newName').focus();return;}
  syncModeExtra();
  const tg=pickMode==='count'?pickTarget:1;
  const sl=pickMode==='slots'
    ?pickSlots.split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean)
    :[];
  if(pickMode==='slots'&&!sl.length)return toast('至少填一个时段');

  if(editId){
    const t=S.tasks.find(x=>x.id===editId);
    if(t){
      t.name=n;t.color=pickColor;t.mode=pickMode;t.target=tg;t.slots=sl;
      t.reminders=pickReminders.map(x=>({time:x}));
      t.reminderEnabled=pickReminders.length>0;
    }
    cancelEdit();
    toast('已保存');
  }else{
    if(S.tasks.length>=50)return toast('最多 50 个任务');
    S.tasks.push({
      id:gid(),name:n,color:pickColor,mode:pickMode,target:tg,slots:sl,
      reminders:pickReminders.map(x=>({time:x})),
      reminderEnabled:pickReminders.length>0
    });
    $('newName').value='';
    toast('已添加');
    buzz();
  }
  save();renderTasks();render();
  /* 保存后重新预约通知 */
  if(IS_NATIVE) scheduleAllNotifications();
};

$('taskList').onclick=e=>{
  const del=e.target.closest('.task-del');
  if(del){e.stopPropagation();delTask(parseInt(del.dataset.i,10));return;}
  const item=e.target.closest('.task-item');
  if(item)startEdit(parseInt(item.dataset.i,10));
};

$('quick').onclick=e=>{
  const b=e.target.closest('.qchip');if(!b)return;
  const t=S.tasks.find(x=>x.id===b.dataset.t);if(!t)return;
  const ds=today();
  if(isDone(t,ds)){openSheet(ds);return;}
  const en=entry(ds,t.id);
  const now=Date.now();
  if(t.mode==='single'){ en.count=1;en.at=now;en.times=[now]; }
  else if(t.mode==='count'){ en.count=Math.min(t.target,en.count+1);en.at=now;en.times.push(now); }
  else{
    const need=slotList(t);if(!en.slots)en.slots={};
    const next=need.find(s=>!en.slots[s]);
    if(next){ en.slots[next]=now;en.at=now; }
  }
  buzz();save();render();renderTasks();
};

$('days').onclick=e=>{
  const c=e.target.closest('.day[data-d]');
  if(c)openSheet(c.dataset.d);
};
$('mask').onclick=closeSheet;
$('sheetCancel').onclick=closeSheet;
$('sheetSave').onclick=saveSheet;

$('prevM').onclick=()=>{curMonth--;if(curMonth<0){curMonth=11;curYear--}render()};
$('nextM').onclick=()=>{curMonth++;if(curMonth>11){curMonth=0;curYear++}render()};
$('todayBtn').onclick=()=>{
  const n=new Date();
  if(curYear===n.getFullYear()&&curMonth===n.getMonth())openSheet(today());
  else{curYear=n.getFullYear();curMonth=n.getMonth();render()}
};

document.querySelectorAll('.tabbar button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    $(b.dataset.pg).classList.add('active');
    if(b.dataset.pg==='pgTask')renderTasks();
    if(b.dataset.pg==='pgSet')renderSettings();
  };
});

/* ========== 主题 ========== */
function applyTheme(){
  const th=(S.settings&&S.settings.theme)||'auto';
  let dark=false;
  if(th==='dark')dark=true;
  else if(th==='light')dark=false;
  else{
    if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){
      dark=true;
    }else if(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches){
      dark=false;
    }else{
      const h=new Date().getHours();
      dark=(h>=18||h<6);
    }
  }
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  const lbl=$('themeLabel');if(lbl)lbl.textContent=THEME_LABEL[th];
}
$('themeBtn').onclick=()=>{
  const order=['auto','light','dark'];
  const i=order.indexOf((S.settings&&S.settings.theme)||'auto');
  S.settings.theme=order[(i+1)%3];
  save();applyTheme();toast('外观：'+THEME_LABEL[S.settings.theme]);
};
if(window.matchMedia){
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const fn=()=>{if(((S.settings&&S.settings.theme)||'auto')==='auto')applyTheme()};
  if(mq.addEventListener)mq.addEventListener('change',fn);
  else if(mq.addListener)mq.addListener(fn);
}
setInterval(()=>{
  if(((S.settings&&S.settings.theme)||'auto')==='auto')applyTheme();
},3600000);

/* ========== 通知：原生 + 浏览器双模式 ========== */

/* 浏览器端：请求权限 */
function reqNotifyBrowser(){
  if(!('Notification' in window))return toast('当前浏览器不支持通知');
  Notification.requestPermission().then(p=>toast(p==='granted'?'通知已开启':'权限被拒绝'));
}

/* 浏览器端：每 20 秒轮询检查（仅在页面存活时有效） */
function checkRemindBrowser(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  const dk=today();
  S.tasks.forEach(t=>{
    if(!t.reminderEnabled)return;
    if(isDone(t,dk))return;
    (t.reminders||[]).forEach(r=>{
      const key=t.id+r.time+dk;
      if(fired.has(key))return;
      const p=r.time.split(':').map(Number);
      if(Math.abs(mins-(p[0]*60+p[1]))<=1){
        fired.add(key);
        try{new Notification('打卡提醒',{body:'该打卡了：'+t.name,tag:'dk-'+t.id})}catch(e){}
        setTimeout(()=>fired.delete(key),180000);
      }
    });
  });
}

/* ========== 原生端：Capacitor 本地通知 ========== */
async function reqNotifyNative(){
  try{
    const LN=Capacitor.Plugins.LocalNotifications;
    let perm=await LN.checkPermissions();
    if(perm.display!=='granted'){
      perm=await LN.requestPermissions();
    }
    if(perm.display==='granted'){
      toast('通知已开启');
      scheduleAllNotifications();
    }else{
      toast('通知权限被拒绝');
    }
  }catch(e){
    toast('通知设置失败：'+e.message);
  }
}

/* 把所有任务的提醒时间提前预约给系统 */
async function scheduleAllNotifications(){
  if(!IS_NATIVE)return;
  try{
    const LN=Capacitor.Plugins.LocalNotifications;

    /* 先取消所有之前的预约，避免重复 */
    const pending=await LN.getPending();
    if(pending.notifications.length>0){
      await LN.cancel({notifications:pending.notifications});
    }

    const notifications=[];
    S.tasks.forEach(task=>{
      if(!task.reminderEnabled||!task.reminders.length)return;
      task.reminders.forEach((rem,index)=>{
        const parts=rem.time.split(':');
        const hour=parseInt(parts[0],10);
        const minute=parseInt(parts[1],10);

        /* 计算下一次触发时间 */
        const now=new Date();
        const first=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hour,minute,0);
        if(first<=now)first.setDate(first.getDate()+1);

        /* 生成唯一 ID：任务 id + 时间 的哈希 */
        const id=hashStr(task.id+rem.time)+index;

        notifications.push({
          id:id,
          title:'⏰ '+task.name,
          body:'别忘了今天的打卡目标哦～',
          schedule:{
            at:first,
            repeats:true,
            every:'day'
          },
          allowWhileIdle:true,
          smallIcon:'ic_stat_icon',
          iconColor:task.color||'#4f6ef7'
        });
      });
    });

    if(notifications.length>0){
      await LN.schedule({notifications});
      console.log('已预约 '+notifications.length+' 条通知');
    }else{
      console.log('没有需要预约的通知');
    }
  }catch(e){
    console.error('预约通知失败',e);
    toast('预约通知失败：'+e.message);
  }
}

/* 统一的权限请求入口 */
$('notifyBtn').onclick=()=>{
  if(IS_NATIVE){
    reqNotifyNative();
  }else{
    reqNotifyBrowser();
  }
};

/* ========== 数据管理 ========== */
function renderSettings(){
  let days=0,entries=0;
  for(const k in S.records){
    days++;
    entries+=Object.keys(S.records[k].entries||{}).length;
  }
  $('dataInfo').textContent=S.tasks.length+' 个任务 · '+days+' 天有记录 · '+entries+' 条打卡';
}
$('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='打卡_'+today()+'.json';
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
  toast('已导出');
};
$('importBtn').onclick=()=>$('imp').click();
$('imp').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  if(f.size>10*1024*1024)return toast('文件太大了');
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d||!Array.isArray(d.tasks))throw 0;
      if(!confirm('导入将替换当前全部数据（'+d.tasks.length+' 个任务），建议先导出备份。继续？'))return;
      S.tasks=d.tasks;
      S.records=(d.records&&typeof d.records==='object')?d.records:{};
      S.settings=Object.assign({theme:'auto'},d.settings||{});
      migrate();save();applyTheme();
      render();renderTasks();renderSettings();
      if(IS_NATIVE)scheduleAllNotifications();
      toast('导入成功');
    }catch(err){toast('导入失败：文件格式不正确')}
  };
  r.readAsText(f);
};
$('clearBtn').onclick=()=>{
  if(!confirm('确定清空全部数据？此操作不可恢复！'))return;
  S.tasks=[];S.records={};
  save();render();renderTasks();renderSettings();
  if(IS_NATIVE)scheduleAllNotifications();
  toast('已清空');
};

/* ========== 启动 ========== */
const _n=new Date();
curYear=_n.getFullYear();curMonth=_n.getMonth();
load();
applyTheme();
render();
renderTasks();
renderSettings();

/* 浏览器端：启动轮询提醒 */
if(!IS_NATIVE){
  setInterval(checkRemindBrowser,20000);
}

/* 原生端：启动时预约所有通知（延迟一下等 Capacitor 准备好） */
if(IS_NATIVE){
  setTimeout(()=>{ scheduleAllNotifications(); },1500);
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    render();
    if(IS_NATIVE)scheduleAllNotifications();
  }
});
window.addEventListener('focus',()=>{
  if(IS_NATIVE)scheduleAllNotifications();
});
</script>
